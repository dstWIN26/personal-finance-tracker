services:
  app:
    build:
      context: .
      # Build RUN steps (pip install) use the host's network namespace. The VPS's
      # default build network has no working outbound route (IPv6 unreachable /
      # port-80 timeouts), while the host can reach PyPI fine. This makes builds
      # reliable without reconfiguring the Docker daemon.
      network: host
    env_file:
      - .env
    environment:
      - DB_PATH=/app/data/finance.db
    # This VPS's default Docker bridge has broken IPv6 egress: for dual-stack hosts
    # (FMP, ECB, Enable Banking) the container tries IPv6 first and the packets
    # black-hole, so outbound connections HANG. Disabling IPv6 in the container's
    # netns forces IPv4 — which works fine here (Caddy reaches Let's Encrypt over
    # IPv4) — and a public resolver avoids host resolv.conf quirks. This is what
    # lets the scheduled bank syncs + market data reach the internet.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
    volumes:
      - ./data:/app/data        # SQLite DB + sessions + auth state (persist!)
      - ./keys:/app/keys        # Enable Banking RSA private key (gitignored, keep private)
    expose:
      - "8000"                  # internal only — never published to the host
    restart: unless-stopped

  caddy:
    image: caddy:2
    depends_on:
      - app
    environment:
      - DOMAIN=${RP_ID}                 # e.g. finance.example.com
      - ACME_EMAIL=${ACME_EMAIL:-}      # optional: email for Let's Encrypt notices
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"                   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data                # persisted TLS certificates
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
